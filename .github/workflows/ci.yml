name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    # 1. Spin up background database containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 2. Global environment variables
    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
      JWT_SECRET: "test_secret_key_for_ci_validation_gate"
      JWT_REFRESH_SECRET: "test_refresh_secret_key_for_ci_gate"
      RESEND_API_KEY: "re_test_key"
      APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client & Nuxt Types
        run: |
          npx prisma generate
          npm run postinstall

      # 3. Push the schema into the container database
      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Run Type Checks
        run: ./node_modules/.bin/vue-tsc --noEmit

      - name: Run Vitest Test Suite
        run: npm run test
